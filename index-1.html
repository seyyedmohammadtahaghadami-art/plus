<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | استاد یار پلاس</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:tahoma}
body{background:#08111f;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff}
.box{width:350px;padding:35px;background:#111b2e;border-radius:18px;text-align:center;box-shadow:0 0 30px rgba(0,0,0,.4)}
h1{color:#18d3c3;margin-bottom:10px}
p{color:#a8b5c8;margin-bottom:20px}
input{width:100%;padding:14px;font-size:22px;text-align:center;border-radius:12px;border:none;outline:none;margin-bottom:15px;background:#1a2842;color:#fff}
button{width:100%;padding:14px;font-size:17px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;background:#18d3c3;color:#04211d}
#errorMsg{margin-top:15px;color:#ff4d4d;height:20px}
.footer{margin-top:20px;font-size:12px;color:#7f8ea3}
</style>
</head>
<body>
<div class="box">
<h1>🎓 استاد یار پلاس</h1>
<p>کد ورود را وارد کنید</p>
<input type="password" id="gateCode" maxlength="8" placeholder="••••••••"
onkeydown="if(event.key==='Enter')checkCode()">
<button onclick="checkCode()">🔓 ورود</button>
<div id="errorMsg"></div>
<div class="footer">نسخه 121</div>
</div>
<script>
if(localStorage.getItem("oy_unlocked")==="1"){
  window.location.replace("app.html");
}
function checkCode(){
 const code=document.getElementById("gateCode").value.trim();
 if(code==="20261405"){
   localStorage.setItem("oy_unlocked","1");
   window.location.replace("app.html");
 }else{
   document.getElementById("errorMsg").textContent="❌ کد اشتباه است";
   document.getElementById("gateCode").value="";
 }
}
</script>
</body>
</html>
