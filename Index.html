<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استاد یار پلاس | ورود</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        font-family: 'Vazirmatn', sans-serif;
        background: radial-gradient(circle at center, #1a2c4e 0%, #0a1020 100%);
        color: #f1f5f9;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .login-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        padding: 20px;
    }

    .login-box {
        background: rgba(16, 26, 48, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.1);
        border-radius: 24px;
        padding: 3rem 2rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease;
    }

    .icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
        display: inline-block;
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    h2 {
        font-family: 'Lalezar', cursive;
        font-size: 2.2rem;
        color: #2dd4bf;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 20px rgba(45, 212, 191, 0.3);
    }

    p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }

    .input-group { position: relative; margin-bottom: 1.5rem; }

    input {
        width: 100%;
        padding: 16px;
        background: #0f172a;
        border: 2px solid #1e293b;
        border-radius: 16px;
        color: #fff;
        font-size: 1.5rem;
        text-align: center;
        letter-spacing: 4px;
        font-family: monospace;
        transition: all 0.3s;
        maxlength="8"
    }

    input:focus {
        border-color: #14b8a6;
        outline: none;
        box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15);
        background: #131c33;
    }

    button {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #0d9488, #14b8a6);
        border: none;
        border-radius: 16px;
        color: #fff;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.2s;
        font-family: 'Vazirmatn', sans-serif;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(20, 184, 166, 0.4);
    }

    button:active { transform: scale(0.98); }

    .error-msg {
        color: #ef4444;
        margin-top: 15px;
        font-size: 0.9rem;
        height: 20px;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .hint {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #475569;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 1rem;
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="icon">🔐</div>
        <h2>کلاس مجازی</h2>
        <p>برای ورود، کد ۸ رقمی کلاس را وارد کنید</p>
        
        <div class="input-group">
            <input id="codeInput" type="tel" placeholder="---- ----" maxlength="8" 
                   autocomplete="off">
        </div>
        
        <button onclick="checkCode()">ورود به کلاس 🚀</button>
        
        <div class="error-msg" id="errorMsg">❌ کد اشتباه است</div>
        
        <div class="hint">
            🔑 کد دسترسی را از معلم خود دریافت کنید<br>
            <span style="font-size: 0.7rem; opacity: 0.7;">نسخه تابستانه v110</span>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // تنظیمات کد دسترسی (تابستانه)
    // ==========================================
    // کد ۸ رقمی جدید
    const VALID_CLASS_CODE = "20262026"; 
    
    // نام فایل اصلی برنامه شما (بعد از لاگین)
    const MAIN_APP_FILE = "app.html"; 

    const input = document.getElementById('codeInput');
    const errorMsg = document.getElementById('errorMsg');

    // اجازه دادن فقط به اعداد (فارسی و انگلیسی)
    input.addEventListener('input', function(e) {
        let val = this.value;
        // تبدیل اعداد فارسی به انگلیسی
        val = val.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
        // حذف هر چیزی غیر از عدد
        this.value = val.replace(/[^0-9]/g, '');
    });

    // زدن Enter برای ورود
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') checkCode();
    });

    function checkCode() {
        const userCode = input.value.trim();
        
        if (userCode === VALID_CLASS_CODE) {
            // ✅ موفقیت
            localStorage.setItem('oy_auth', 'true');
            
            // افکت موفقیت
            input.style.borderColor = '#10b981';
            input.style.color = '#10b981';
            
            setTimeout(() => {
                window.location.href = MAIN_APP_FILE;
            }, 500);
        } else {
            // ❌ خطا
            errorMsg.style.opacity = '1';
            input.style.borderColor = '#ef4444';
            input.value = '';
            input.focus();
            
            setTimeout(() => {
                errorMsg.style.opacity = '0';
                input.style.borderColor = '#1e293b';
            }, 3000);
        }
    }

    // چک کردن اینکه آیا قبلاً لاگین کرده یا نه
    if (localStorage.getItem('oy_auth') === 'true') {
        window.location.href = MAIN_APP_FILE;
    }
</script>

</body>
</html>
