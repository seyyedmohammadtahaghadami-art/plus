<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | استاد یار پلاس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif;
            background: #0a1020;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gate-box {
            background: rgba(16, 26, 48, .88);
            border: 1px solid rgba(148, 163, 184, .1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            width: 340px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }
        .gate-box h1 {
            color: #2dd4bf;
            font-size: 26px;
            margin-bottom: 6px;
        }
        .gate-box p {
            color: #8fa3bf;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .gate-box input {
            text-align: center;
            font-size: 20px;
            letter-spacing: 8px;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(148, 163, 184, .14);
            background: #0a1020;
            color: #f1f5f9;
            width: 100%;
            margin-bottom: 16px;
            outline: none;
            transition: .3s;
        }
        .gate-box input:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 20px rgba(20, 184, 166, .15);
        }
        .btn {
            background: #14b8a6;
            border: none;
            color: #04211d;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: .2s;
        }
        .btn:hover {
            opacity: .85;
            transform: scale(1.02);
        }
        .error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
        }
        .footer {
            color: #4a5a7a;
            font-size: 11px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="gate-box">
        <h1>🎓 استاد یار پلاس</h1>
        <p>نسخه ۱۲۱ · P2P · بدون سرور</p>
        <input type="password" id="gateCode" placeholder="••••••••" maxlength="8" onkeydown="if(event.key==='Enter')checkCode()">
        <button class="btn" onclick="checkCode()">🔓 ورود</button>
        <div class="error" id="errorMsg"></div>
        <div class="footer">کد: 20261405</div>
    </div>

    <script>
        function checkCode() {
            const code = document.getElementById('gateCode').value.trim();
            if (code === '20261405') {
                // ذخیره در localStorage
                localStorage.setItem('oy_unlocked', '1');
                // رفتن به صفحه اصلی
                window.location.href = 'app.html';
            } else {
                document.getElementById('errorMsg').textContent = '❌ کد دسترسی اشتباه است!';
                document.getElementById('gateCode').value = '';
                document.getElementById('gateCode').style.borderColor = '#ef4444';
                setTimeout(() => {
                    document.getElementById('gateCode').style.borderColor = '';
                }, 2000);
            }
        }
    </script>

</body>
</html>
